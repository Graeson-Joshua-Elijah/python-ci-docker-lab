# ============================================================
# File: .github/workflows/ci-dockerhub.yml
# Purpose: Build, test, and push Docker image to Docker Hub
# ============================================================

name: CI to Docker Hub

on:
  push:
    branches: [ "main" ]          # Trigger on pushes to main
    tags: [ "v*" ]                # Also trigger on version tags like v1.0.0
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # 1️⃣ Checkout repository
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # 2️⃣ Set up Python
      # ---------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------
      # 3️⃣ Install dependencies
      # ---------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------
      # 4️⃣ Run tests with pytest
      # ---------------------------------------
      - name: Run tests
        run: |
          PYTHONPATH=. pytest -q

      # ---------------------------------------
      # 5️⃣ Extract Docker metadata (tags & labels)
      # ---------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/python-ci-lab
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # ---------------------------------------
      # 6️⃣ Set up QEMU (multi-arch support)
      # ---------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ---------------------------------------
      # 7️⃣ Set up Docker Buildx (for build cache and platforms)
      # ---------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------
      # 8️⃣ Log in to Docker Hub using GitHub Secrets
      # ---------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------
      # 9️⃣ Build and push Docker image
      # ---------------------------------------
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ---------------------------------------
      # 🔟 Optional: Print success message
      # ---------------------------------------
      - name: Post-build summary
        run: |
          echo "✅ Build and push complete!"
          echo "Pushed image: ${{ secrets.DOCKERHUB_USERNAME }}/python-ci-lab"
          echo "Tags used: ${{ steps.meta.outputs.tags }}"
